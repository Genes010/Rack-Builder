<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rack Builder — Connection Diagram</title>
<style>
  :root{--bg:#0d0f13;--panel:#171a20;--panel2:#20242c;--line:#313642;--text:#e8ebf2;--muted:#8e96a7;--accent:#4c8dff;--grid:rgba(125,142,168,.12)}
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:#4a5261}button.primary{background:#2f6ede;border-color:#4c8dff}button:disabled{opacity:.4;cursor:default}
  header{height:58px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20}header h1{font-size:15px;margin:0 10px 0 0;white-space:nowrap}.spacer{flex:1}.zoom-label{width:54px;text-align:center;color:var(--muted);font-size:11px}.status{max-width:560px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viewport{position:absolute;inset:58px 0 0;overflow:auto;cursor:grab;overscroll-behavior:contain;background-color:#0b0d11;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(rgba(125,142,168,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(125,142,168,.05) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px}
  body.diagram-panning,body.diagram-panning *{cursor:grabbing!important;user-select:none!important}
  .world{position:relative;width:8000px;height:8000px;transform-origin:0 0}.wires{position:absolute;inset:0;width:8000px;height:8000px;overflow:visible;pointer-events:none;z-index:2}.wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px #000);opacity:.9;transition:opacity .12s}.wires.has-selection .wire:not(.selected){opacity:.28}.wire.selected{stroke-width:5;opacity:1;filter:drop-shadow(0 0 5px rgba(255,255,255,.85))}.wire-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}.wire-preview{fill:none;stroke:#a9c8ff;stroke-width:2.5;stroke-dasharray:7 5}
  .bend{pointer-events:all;cursor:move;stroke:#fff;stroke-width:2;filter:drop-shadow(0 1px 3px #000);opacity:.58;transition:opacity .12s,r .12s,stroke-width .12s}.bend:hover{opacity:1}.bend.selected{opacity:1;stroke-width:3;filter:drop-shadow(0 0 6px #fff)}.add-bend{pointer-events:all;cursor:copy;fill:#161a21;stroke:#fff;stroke-width:1.5}
  .node{position:absolute;width:250px;min-height:92px;border:1px solid #3a414e;border-radius:9px;background:linear-gradient(#222731,#191d24);box-shadow:0 10px 24px rgba(0,0,0,.45);z-index:4;user-select:none;cursor:move;touch-action:none}.node.selected,.node.multi-selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(76,141,255,.32),0 12px 28px rgba(0,0,0,.5)}.node.cable-endpoint{border-color:#86b8ff;box-shadow:0 0 0 2px rgba(76,141,255,.2),0 10px 24px rgba(0,0,0,.45)}
  .node-head{height:44px;padding:7px 10px;cursor:move;border-bottom:1px solid #333944;background:rgba(255,255,255,.025);border-radius:9px 9px 0 0}.node-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-meta{font-size:10px;color:var(--muted);margin-top:2px}.ports{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 9px 10px;min-height:42px}.port-list{display:flex;flex-direction:column;gap:5px}.port-row{position:relative;height:18px;display:flex;align-items:center;gap:5px;color:#bec5d2;font-size:9px;white-space:nowrap}.port-list.right .port-row{justify-content:flex-end;text-align:right}.port-label{max-width:92px;overflow:hidden;text-overflow:ellipsis}.port-type{color:#727b8d;font-size:8px}.port-dot{position:absolute;top:50%;width:12px;height:12px;margin:0;padding:0;border-radius:50%;transform:translateY(-50%);border:2px solid rgba(255,255,255,.8);box-shadow:0 0 5px currentColor;opacity:.7;cursor:crosshair}.port-row:hover .port-dot{opacity:1;transform:translateY(-50%) scale(1.18)}.port-list.left .port-dot{left:-16px}.port-list.right .port-dot{right:-16px}.port-dot.input{background:#388bff;color:#388bff}.port-dot.output{background:#3ecf8e;color:#3ecf8e}.port-dot.bidirectional{background:#f0b64d;color:#f0b64d}.port-dot.target{opacity:1;box-shadow:0 0 0 4px rgba(76,141,255,.35),0 0 10px #fff}.port-dot.cable-endpoint{opacity:1;transform:translateY(-50%) scale(1.32);box-shadow:0 0 0 4px rgba(255,255,255,.34),0 0 12px #fff}
  .rack-tag{position:absolute;top:-22px;left:0;color:#6f788a;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}.empty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:28px 34px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;background:rgba(23,26,32,.7)}
  .world.cable-target-search .port-dot:not(.compatible-target):not(.cable-source){opacity:.12;filter:saturate(.35)}.world.cable-target-search .port-dot.compatible-target{opacity:1;transform:translateY(-50%) scale(1.45);box-shadow:0 0 0 4px rgba(255,255,255,.3),0 0 18px 3px currentColor;filter:none}.world.cable-target-search .port-dot.cable-source{opacity:1;transform:translateY(-50%) scale(1.35);box-shadow:0 0 0 4px rgba(255,255,255,.28),0 0 16px currentColor;filter:none}
  .lasso-box{position:absolute;z-index:3;border:1.5px solid #73a5ff;background:rgba(76,141,255,.14);box-shadow:0 0 12px rgba(76,141,255,.3);pointer-events:none}
  .export-bg{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}.export-bg.open{display:flex}.export-box{width:min(460px,94vw);padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.7)}.export-box h2{margin:0 0 4px;font-size:17px}.export-box p{margin:0 0 16px;color:var(--muted);font-size:11px}.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.export-grid label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:11px}.export-grid label:last-child{grid-column:1/3}.export-grid input{width:100%;padding:8px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px}.export-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px}.legend i{width:8px;height:8px;border-radius:50%}
  @media print{header{display:none}.viewport{position:static;overflow:visible}.world{zoom:.55!important}.node{break-inside:avoid}body{background:#fff}.viewport{background-color:#fff}}
</style>
</head>
<body>
<header>
  <h1>Connection Diagram</h1>
  <select id="side"><option value="back">Rear connections</option><option value="front">Front connections</option></select>
  <button id="zoomOut">−</button><span class="zoom-label" id="zoomLabel">100%</span><button id="zoomIn">+</button>
  <button id="fit">Fit</button><button id="auto">Auto layout</button><button id="route" title="Redistribute visible cables into separate parallel lanes">Route cables</button>
  <button type="button" id="delete" disabled>Delete selected</button><button type="button" id="print">Multi-page PDF</button><button type="button" id="png">PNG</button>
  <div class="spacer"></div>
  <div class="legend"><i style="background:#3ecf8e"></i>Output <i style="background:#388bff"></i>Input <i style="background:#f0b64d"></i>Both</div>
  <span class="status" id="status">Move devices and select cables to edit their routes.</span>
</header>
<div class="viewport" id="viewport"><div class="world" id="world"><svg class="wires" id="wires" viewBox="0 0 8000 8000"></svg><div id="nodes"></div></div></div>
<div class="export-bg" id="pngExportBg"><div class="export-box"><h2>Export diagram as PNG</h2><p>Choose the exact image resolution and how large the diagram should appear inside it.</p><div class="export-grid"><label>Width (px)<input id="pngWidth" type="number" min="320" max="8000" step="10" value="3840"></label><label>Height (px)<input id="pngHeight" type="number" min="240" max="8000" step="10" value="2160"></label><label>Diagram scale (%)<input id="pngScale" type="number" min="25" max="200" step="5" value="90"></label></div><div class="export-actions"><button type="button" id="pngCancel">Cancel</button><button type="button" class="primary" id="pngDownload">Download PNG</button></div></div></div>
<script>
"use strict";
const LS_KEY='rackBuilder.v2',W=250,HEADER=44,ROW=23,WORLD_W=8000,WORLD_H=8000,ROUTE_VERSION=5,LANE_GAP=22,ESCAPE_GAP=14;
let state=null,side='back',zoom=1,selectedCable=null,selectedNodes=new Set(),selectedBends=new Set(),nodeDrag=null,nodeWireFrame=0,bendDrag=null,newWire=null,middlePan=null,lasso=null,scrollAnimation=0,scrollTargetX=0,scrollTargetY=0,renderedWireViews=[],renderedBendViews=[];
const world=document.getElementById('world'),wires=document.getElementById('wires'),nodes=document.getElementById('nodes'),statusEl=document.getElementById('status'),viewport=document.getElementById('viewport');
const gearById=id=>state.library.find(g=>g.id===id)||null;
const externalRack=()=>({id:'external',name:'External gear',he:0,placed:state.external||[],cables:[]});
const containers=()=>[...state.racks,...((state.external||[]).length?[externalRack()]:[])];
const rackById=id=>id==='external'?externalRack():state.racks.find(r=>r.id===id)||null;
const colorFor=type=>({SDI:'#48a6ff',HDMI:'#c86cff',DisplayPort:'#668cff',Ethernet:'#3ecf8e',Fiber:'#ff9f43',Power:'#f0d34a',Audio:'#f15b97',USB:'#6bcbd1',Other:'#b3bac7'})[type]||'#b3bac7';
function esc(value){return String(value??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function ensureState(){
  const raw=localStorage.getItem(LS_KEY); if(!raw)return false; state=JSON.parse(raw); state.diagram=state.diagram||{nodes:{},zoom:1,side:'back'}; state.diagram.nodes=state.diagram.nodes||{}; side=state.diagram.side||'back'; zoom=Math.max(.5,Math.min(2,Number(state.diagram.zoom)||1));
  state.external=Array.isArray(state.external)?state.external:[];state.externalCables=Array.isArray(state.externalCables)?state.externalCables:[];state.crossCables=Array.isArray(state.crossCables)?state.crossCables:[];
  state.externalCables.forEach(c=>{if(c&&c.id&&!state.crossCables.some(x=>x.id===c.id))state.crossCables.push(c);});state.externalCables=[];
  state.racks.forEach(r=>{r.cables=Array.isArray(r.cables)?r.cables:[];});[...state.racks.flatMap(r=>r.cables),...state.crossCables].forEach(c=>{if(!Array.isArray(c.diagramPoints))c.diagramPoints=null;}); return true;
}
function save(){state.diagram.side=side;state.diagram.zoom=zoom;localStorage.setItem(LS_KEY,JSON.stringify(state));}
function placements(){const result=[];state.racks.forEach((rack,ri)=>rack.placed.slice().sort((a,b)=>a.top-b.top).forEach((p,pi)=>{const gear=gearById(p.libId);if(gear)result.push({rack,ri,p,pi,gear,external:false});}));const rack=externalRack();(state.external||[]).forEach((p,pi)=>{const gear=gearById(p.libId);if(gear)result.push({rack,ri:state.racks.length,p,pi,gear,external:true});});return result;}
function placementRecord(uid){return placements().find(item=>item.p.uid===uid)||null;}
function cableRecords(){const records=[];state.racks.forEach(rack=>(rack.cables||[]).forEach(cable=>records.push({scope:rack.id,rack,cable})));(state.crossCables||[]).forEach(cable=>records.push({scope:'cross',rack:null,cable}));return records;}
function selectedRecord(){return selectedCable?cableRecords().find(record=>record.scope===selectedCable.rackId&&record.cable.id===selectedCable.id)||null:null;}
function bendKey(scope,cableId,index){return scope+'|'+cableId+'|'+index;}
function bendTarget(key){for(const record of cableRecords()){const points=record.cable.diagramPoints||[];for(let index=0;index<points.length;index++)if(bendKey(record.scope,record.cable.id,index)===key)return{record,cable:record.cable,index,point:points[index]};}return null;}
function connectorList(gear){const map=gear.connectors||{},list=map[side];return Array.isArray(list)?list:[];}
function portGroups(gear){
  const list=connectorList(gear),inputs=list.filter(c=>c.direction==='input'),outputs=list.filter(c=>c.direction==='output'),both=list.filter(c=>c.direction==='bidirectional');
  return outputs.length>=inputs.length?{left:inputs,right:[...outputs,...both]}:{left:[...inputs,...both],right:outputs};
}
function connectorVisualSide(groups,connector){return groups.left.some(c=>c.id===connector.id)?'left':'right';}
function nodeHeight(gear){const g=portGroups(gear);return Math.max(92,HEADER+20+Math.max(g.left.length,g.right.length)*ROW);}
function automaticPositions(){const result={};containers().forEach((rack,ri)=>{let y=80;rack.placed.slice().sort((a,b)=>(a.top||0)-(b.top||0)).forEach(p=>{const gear=gearById(p.libId);if(!gear)return;result[p.uid]={x:80+ri*340,y};y+=nodeHeight(gear)+62;});});return result;}
function ensurePositions(){let changed=false;const items=placements(),valid=new Set(items.map(item=>item.p.uid)),defaults=automaticPositions();Object.keys(state.diagram.nodes).forEach(uid=>{if(!valid.has(uid)){delete state.diagram.nodes[uid];changed=true;}});items.forEach(item=>{if(!state.diagram.nodes[item.p.uid]){state.diagram.nodes[item.p.uid]=defaults[item.p.uid];changed=true;}});if(changed)save();}
function positionFor(uid){return state.diagram.nodes[uid]||{x:80,y:80};}
function endpoint(rack,cable,role){
  const ref=cable[role],placement=rack.placed.find(p=>p.uid===ref.uid);if(!placement)return null;const gear=gearById(placement.libId);if(!gear)return null;const connector=connectorList(gear).find(c=>c.id===ref.connectorId);if(!connector)return null;
  const groups=portGroups(gear),visualSide=connectorVisualSide(groups,connector),list=groups[visualSide],index=Math.max(0,list.findIndex(c=>c.id===connector.id)),pos=positionFor(placement.uid);
  return{x:pos.x+(visualSide==='right'?W:0),y:pos.y+HEADER+15+index*ROW,side:visualSide,connector,placement,gear,node:{x:pos.x,y:pos.y,w:W,h:nodeHeight(gear)}};
}
function recordEndpoint(record,role){
  if(record.rack)return endpoint(record.rack,record.cable,role);
  const ref=record.cable[role],item=placementRecord(ref.uid);if(!item)return null;const connector=connectorList(item.gear).find(c=>c.id===ref.connectorId);if(!connector)return null;
  const groups=portGroups(item.gear),visualSide=connectorVisualSide(groups,connector),list=groups[visualSide],index=Math.max(0,list.findIndex(c=>c.id===connector.id)),pos=positionFor(item.p.uid);
  return{x:pos.x+(visualSide==='right'?W:0),y:pos.y+HEADER+15+index*ROW,side:visualSide,connector,placement:item.p,gear:item.gear,node:{x:pos.x,y:pos.y,w:W,h:nodeHeight(item.gear)}};
}
function pathD(a,points,b){return'M '+a.x+' '+a.y+' '+(points||[]).map(p=>'L '+p.x+' '+p.y+' ').join('')+'L '+b.x+' '+b.y;}
function routePoints(a,b,index,count){
  const corridor=b.x-a.x,required=56+Math.max(0,count-1)*LANE_GAP;
  if(a.side==='right'&&b.side==='left'&&corridor>=required){const offset=(index-(count-1)/2)*LANE_GAP,mid=Math.round(((a.x+b.x)/2+offset)/4)*4;return[{x:mid,y:a.y},{x:mid,y:b.y}];}
  const step=18,minTop=Math.min(a.node.y,b.node.y),maxBottom=Math.max(a.node.y+a.node.h,b.node.y+b.node.h),sourceCenter=a.node.y+a.node.h/2,targetCenter=b.node.y+b.node.h/2,needed=42+(count-1)*step;
  let above=targetCenter<sourceCenter;if(above&&minTop<needed+24)above=false;
  const routeY=above?minTop-42-index*step:maxBottom+42+index*step,outA=a.side==='left'?-1:1,outB=b.side==='left'?-1:1,escapeFrom=a.x+outA*(28+index*ESCAPE_GAP),escapeTo=b.x+outB*(28+index*ESCAPE_GAP);
  return[{x:escapeFrom,y:a.y},{x:escapeFrom,y:routeY},{x:escapeTo,y:routeY},{x:escapeTo,y:b.y}];
}
function pointsMatch(a,b){return Array.isArray(a)&&a.length===b.length&&a.every((p,i)=>Math.abs(p.x-b[i].x)<.1&&Math.abs(p.y-b[i].y)<.1);}
function routeVisibleCables(force=false){
  const groups=new Map();
  cableRecords().filter(record=>record.cable.view===side).forEach(record=>{const cable=record.cable,a=recordEndpoint(record,'from'),b=recordEndpoint(record,'to');if(!a||!b)return;const key=cable.from.uid+'>'+cable.to.uid;if(!groups.has(key))groups.set(key,[]);groups.get(key).push({cable,a,b});});
  let changed=false;
  groups.forEach(group=>{group.sort((x,y)=>x.a.y-y.a.y||x.b.y-y.b.y||String(x.cable.id).localeCompare(String(y.cable.id)));group.forEach((item,index)=>{const cable=item.cable,needsUpgrade=cable.diagramRouteVersion!==ROUTE_VERSION;if((force||needsUpgrade)&&cable.diagramManual){cable.diagramManual=false;changed=true;}if(force||needsUpgrade||!cable.diagramManual){const next=routePoints(item.a,item.b,index,group.length);if(!pointsMatch(cable.diagramPoints,next)){cable.diagramPoints=next;changed=true;}if(needsUpgrade){cable.diagramRouteVersion=ROUTE_VERSION;changed=true;}}});});
  return changed;
}
function svg(tag,attrs={}){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,String(v)));return el;}
function render(){ensurePositions();document.getElementById('side').value=side;applyZoom(false);renderNodes();const routesChanged=renderWires();if(routesChanged)save();}
function renderNodes(){
  nodes.innerHTML='';const items=placements(),valid=new Set(items.map(item=>item.p.uid));selectedNodes=new Set([...selectedNodes].filter(uid=>valid.has(uid)));if(!items.length){nodes.innerHTML='<div class="empty">No rack equipment yet.<br>Add gear in Rack Builder first.</div>';return;}
  items.forEach(item=>{const pos=positionFor(item.p.uid),groups=portGroups(item.gear),node=document.createElement('section');node.className='node'+(selectedNodes.has(item.p.uid)?' multi-selected':'');node.dataset.uid=item.p.uid;node.style.left=pos.x+'px';node.style.top=pos.y+'px';node.style.height=nodeHeight(item.gear)+'px';
    const high=item.external?0:item.rack.he-item.p.top,low=item.external?0:item.rack.he-(item.p.top+item.gear.he)+1,unit=item.external?'Free-standing':(low===high?'U'+high:'U'+low+'–'+high);
    node.innerHTML='<span class="rack-tag">'+esc(item.rack.name)+'</span><div class="node-head"><div class="node-name">'+esc(item.gear.name)+'</div><div class="node-meta">'+esc(item.rack.name)+' · '+unit+(item.external?'':' · '+item.gear.he+'U')+'</div></div><div class="ports"><div class="port-list left"></div><div class="port-list right"></div></div>';
    const fill=(root,list,visualSide)=>list.forEach(c=>{const row=document.createElement('div');row.className='port-row';row.innerHTML=visualSide==='left'?'<button class="port-dot '+(c.direction||'bidirectional')+'"></button><span class="port-label">'+esc(c.name||'Port')+'</span><span class="port-type">'+esc(c.type||'Other')+'</span>':'<span class="port-type">'+esc(c.type||'Other')+'</span><span class="port-label">'+esc(c.name||'Port')+'</span><button class="port-dot '+(c.direction||'bidirectional')+'"></button>';
      const role=c.direction==='input'?'to':c.direction==='output'?'from':'both',dot=row.querySelector('.port-dot');dot.dataset.rackId=item.rack.id;dot.dataset.uid=item.p.uid;dot.dataset.connectorId=c.id;dot.dataset.type=c.type||'Other';dot.dataset.direction=c.direction||'bidirectional';dot.dataset.role=role;if(role!=='to')dot.addEventListener('pointerdown',e=>startNewWire(e,item.rack,item.p,c,dot));root.appendChild(row);});
    fill(node.querySelector('.left'),groups.left,'left');fill(node.querySelector('.right'),groups.right,'right');
    node.addEventListener('pointerdown',e=>startNodeDrag(e,node,item.p.uid));nodes.appendChild(node);
  });
}
function renderWires(){
  const routesChanged=routeVisibleCables(false),visibleRecords=cableRecords().filter(record=>record.cable.view===side),validBends=new Set();visibleRecords.forEach(record=>(record.cable.diagramPoints||[]).forEach((point,index)=>validBends.add(bendKey(record.scope,record.cable.id,index))));selectedBends=new Set([...selectedBends].filter(key=>validBends.has(key)));wires.innerHTML='';renderedWireViews=[];renderedBendViews=[];visibleRecords.forEach(record=>{const cable=record.cable,a=recordEndpoint(record,'from'),b=recordEndpoint(record,'to');if(!a||!b)return;const selected=selectedCable&&selectedCable.rackId===record.scope&&selectedCable.id===cable.id,d=pathD(a,cable.diagramPoints||[],b),color=cable.color||colorFor(cable.type);
    const path=svg('path',{class:'wire'+(selected?' selected':''),d,stroke:color});wires.appendChild(path);const hit=svg('path',{class:'wire-hit',d});hit.addEventListener('click',e=>{e.stopPropagation();selectedBends.clear();selectedNodes.clear();syncNodeSelectionClasses();selectedCable=selected?null:{rackId:record.scope,id:cable.id};renderWires();});wires.appendChild(hit);renderedWireViews.push({record,path,hit});
    if(selected||cable.diagramManual){cable.diagramPoints.forEach((p,index)=>{const key=bendKey(record.scope,cable.id,index),pointSelected=selectedBends.has(key),handle=svg('circle',{class:'bend'+(pointSelected?' selected':''),cx:p.x,cy:p.y,r:pointSelected?7:5.5,fill:color});handle.dataset.bendKey=key;handle.addEventListener('pointerdown',e=>startBendDrag(e,record,index,handle));wires.appendChild(handle);renderedBendViews.push({key,record,index,handle});});}
    if(selected){const all=[a,...cable.diagramPoints,b];for(let i=0;i<all.length-1;i++){const add=svg('circle',{class:'add-bend',cx:(all[i].x+all[i+1].x)/2,cy:(all[i].y+all[i+1].y)/2,r:4.5});add.addEventListener('click',e=>{e.stopPropagation();selectedBends.clear();cable.diagramManual=true;cable.diagramRouteVersion=ROUTE_VERSION;cable.diagramPoints.splice(i,0,{x:(all[i].x+all[i+1].x)/2,y:(all[i].y+all[i+1].y)/2});save();renderWires();});wires.appendChild(add);}}
  });applyCableFocus();updateStatus();return routesChanged;
}

document.getElementById('side').addEventListener('change',e=>{side=e.target.value;selectedCable=null;selectedBends.clear();selectedNodes.clear();save();render();});document.getElementById('zoomOut').addEventListener('click',()=>{zoom=Math.max(.5,Math.round((zoom-.1)*10)/10);applyZoom();});document.getElementById('zoomIn').addEventListener('click',()=>{zoom=Math.min(2,Math.round((zoom+.1)*10)/10);applyZoom();});document.getElementById('fit').addEventListener('click',fit);document.getElementById('auto').addEventListener('click',()=>{if(confirm('Reset all device positions to an automatic rack layout?'))autoLayout();});document.getElementById('print').addEventListener('click',exportDiagramPdf);document.getElementById('png').addEventListener('click',openPngExport);document.getElementById('pngCancel').addEventListener('click',closePngExport);document.getElementById('pngDownload').addEventListener('click',downloadDiagramPng);document.getElementById('pngExportBg').addEventListener('click',e=>{if(e.target===e.currentTarget)closePngExport();});document.getElementById('delete').addEventListener('click',deleteSelection);
document.getElementById('route').addEventListener('click',()=>{const hasManual=cableRecords().some(record=>record.cable.view===side&&record.cable.diagramManual);if(hasManual&&!confirm('Replace manual cable bends on this side with evenly spaced automatic routes?'))return;routeVisibleCables(true);selectedCable=null;selectedBends.clear();save();renderWires();});
viewport.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.altKey||e.ctrlKey){stopSmoothScroll();const rect=viewport.getBoundingClientRect(),anchorX=e.clientX-rect.left,anchorY=e.clientY-rect.top,worldX=(viewport.scrollLeft+anchorX)/zoom,worldY=(viewport.scrollTop+anchorY)/zoom,next=Math.max(.5,Math.min(2,Math.round((zoom+(e.deltaY<0?.1:-.1))*10)/10));if(next===zoom)return;zoom=next;applyZoom();viewport.scrollLeft=worldX*zoom-anchorX;viewport.scrollTop=worldY*zoom-anchorY;syncScrollTargets();return;}
  if(middlePan)return;const factor=e.deltaMode===1?18:e.deltaMode===2?viewport.clientHeight:1,horizontal=e.shiftKey&&Math.abs(e.deltaX)<Math.abs(e.deltaY),dx=(horizontal?e.deltaY:e.deltaX)*factor,dy=(horizontal?0:e.deltaY)*factor;queueSmoothScroll(dx,dy);
},{passive:false});
viewport.addEventListener('pointerdown',startMiddlePan,true);viewport.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault();});viewport.addEventListener('scroll',()=>{if(!scrollAnimation&&!middlePan)syncScrollTargets();},{passive:true});syncScrollTargets();
world.addEventListener('pointerdown',startLasso);
window.addEventListener('keydown',e=>{const typing=e.target&&e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"]');if((e.key==='Delete'||e.key==='Backspace')&&(selectedCable||selectedBends.size)&&!typing){e.preventDefault();e.stopPropagation();deleteSelection();return;}if(e.key==='Escape'){if(newWire){window.removeEventListener('pointermove',moveNewWire);window.removeEventListener('pointerup',endNewWire);newWire.preview.remove();newWire=null;clearCompatibleWireTargets();}selectedCable=null;selectedNodes.clear();selectedBends.clear();syncNodeSelectionClasses();renderWires();}},true);window.addEventListener('storage',e=>{if(e.key===LS_KEY&&!nodeDrag&&!bendDrag&&!newWire){ensureState();render();}});
if(!ensureState()){nodes.innerHTML='<div class="empty">No Rack Builder project found in this browser.</div>';}else render();
</script>
</body>

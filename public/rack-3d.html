<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rack Builder — 3D Depth View</title>
<style>
  :root{--bg:#0b0d11;--panel:#171a20;--panel2:#20242c;--line:#313642;--text:#e8ebf2;--muted:#9098a8;--accent:#4c8dff;--bad:#ff5c6c;--warn:#f0b64d;--ok:#3ecf8e}
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:#586273}button.primary{background:#2f6ede;border-color:#4c8dff}
  header{height:58px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:4}h1{font-size:15px;margin:0 10px 0 0;white-space:nowrap}.spacer{flex:1}.hint{color:var(--muted);font-size:11px;white-space:nowrap}
  .workspace{height:calc(100% - 58px);display:grid;grid-template-columns:minmax(0,1fr) 310px}.stage{position:relative;min-width:0;overflow:hidden;background-color:#090b0f;background-image:linear-gradient(rgba(120,137,160,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(120,137,160,.09) 1px,transparent 1px);background-size:24px 24px}.stage:after{content:'';position:absolute;left:8%;right:8%;bottom:7%;height:25%;background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 68%);pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:1}canvas.dragging{cursor:grabbing}.instructions{position:absolute;left:14px;bottom:12px;padding:7px 10px;border:1px solid rgba(70,78,91,.7);border-radius:7px;background:rgba(13,15,19,.82);color:var(--muted);font-size:10px;z-index:2;pointer-events:none}
  aside{min-width:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}.summary{padding:14px;border-bottom:1px solid var(--line)}.summary h2{margin:0 0 4px;font-size:15px}.summary p{margin:0;color:var(--muted);font-size:11px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.card{padding:8px;border:1px solid var(--line);border-radius:8px;background:#11141a}.card span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.5px}.card b{display:block;margin-top:2px;font-size:13px}.card.bad b{color:var(--bad)}.card.warn b{color:var(--warn)}
  .gear-list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:7px}.gear-row{width:100%;display:block;text-align:left;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.gear-row:hover,.gear-row.selected{border-color:var(--accent)}.gear-row.selected{box-shadow:inset 3px 0 0 var(--accent)}.gear-row .top{display:flex;justify-content:space-between;gap:8px}.gear-row strong{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gear-row small{color:var(--muted);white-space:nowrap}.depth-track{height:5px;margin-top:7px;border-radius:4px;background:#0d0f13;overflow:hidden}.depth-track i{display:block;height:100%;border-radius:4px;background:var(--accent)}.gear-row.bad .depth-track i{background:var(--bad)}.gear-row.warn .depth-track i{background:var(--warn)}.badges{display:flex;gap:4px;margin-top:6px}.badge{padding:2px 5px;border-radius:4px;background:#11141a;color:var(--muted);font-size:8px}.badge.bad{color:#ffd9dd;background:rgba(255,92,108,.16)}.badge.warn{color:#ffe4b3;background:rgba(240,182,77,.15)}.empty{padding:32px 16px;text-align:center;color:var(--muted)}
  @media(max-width:800px){header .hint{display:none}.workspace{grid-template-columns:1fr}.stage{height:62vh}aside{position:absolute;left:0;right:0;bottom:0;height:38vh;border-left:0;border-top:1px solid var(--line);z-index:3}.summary{padding:9px 12px}.cards{display:none}}
</style>
</head>
<body>
<header>
  <h1>3D Rack Depth</h1>
  <select id="rackSelect" aria-label="Rack"></select>
  <button id="front">Front</button><button id="iso" class="primary">3D</button><button id="rear">Rear</button>
  <button id="zoomOut" title="Zoom out">−</button><button id="zoomIn" title="Zoom in">+</button>
  <div class="spacer"></div><span class="hint">Drag to rotate · wheel to zoom · double-click to reset</span>
</header>
<div class="workspace">
  <main class="stage" id="stage"><canvas id="canvas"></canvas><div class="instructions">Blue = fits · amber = missing depth · red = too deep or collision</div></main>
  <aside><section class="summary" id="summary"></section><div class="gear-list" id="gearList"></div></aside>
</div>
<script>
"use strict";
const LS_KEY='rackBuilder.v2',U_MM=44.45,RACK_W=482.6,BUILTINS={blank1:{id:'blank1',name:'Blank panel',he:1,depth:12,blank:true,mount:'both',width:'full'},blank2:{id:'blank2',name:'Blank panel',he:2,depth:12,blank:true,mount:'both',width:'full'}};
let state=null,rackId=null,selectedUid=null,yaw=-.62,pitch=-.28,zoom=1,drag=null,boxes=[];
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),summary=document.getElementById('summary'),gearList=document.getElementById('gearList');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),gearById=id=>BUILTINS[id]||(state.library||[]).find(g=>g.id===id)||null,rack=()=>state&&state.racks.find(r=>r.id===rackId)||null;
function esc(value){return String(value??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function loadState(){try{state=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){state=null;}if(!state||!Array.isArray(state.racks))return false;state.racks.forEach(r=>r.depth=clamp(Number(r.depth)||600,200,1600));if(!rackId||!state.racks.some(r=>r.id===rackId))rackId=state.racks[0]&&state.racks[0].id;return !!rackId;}
function positionLabel(r,p,g){const high=r.he-p.top,low=r.he-(p.top+g.he)+1,side=g.width==='half'?(p.col===1?' R':' L'):'';return(low===high?'U'+high:'U'+low+'–'+high)+side;}
function makeBoxes(){
  const r=rack();boxes=[];if(!r)return;const H=r.he*U_MM,D=r.depth,inset=18;
  for(const p of r.placed||[]){const g=gearById(p.libId);if(!g)continue;const rawDepth=Number(g.depth)||0,drawDepth=rawDepth||60,half=g.width==='half',gap=5,x1=half?(p.col===1?gap:RACK_W/-2+inset):(RACK_W/-2+inset),x2=half?(p.col===1?RACK_W/2-inset:-gap):(RACK_W/2-inset),y2=H/2-p.top*U_MM-2,y1=y2-g.he*U_MM+4,rear=g.mount==='rear',z1=rear?D/2-drawDepth:-D/2,z2=rear?D/2:-D/2+drawDepth;
    boxes.push({uid:p.uid,p,g,name:g.name,depth:rawDepth,drawDepth,x1,x2,y1,y2,z1,z2,over:rawDepth>D,unknown:!rawDepth,collision:false,label:positionLabel(r,p,g)});
  }
  for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a=boxes[i],b=boxes[j],overlap=a.x1<b.x2&&a.x2>b.x1&&a.y1<b.y2&&a.y2>b.y1&&Math.min(a.z1,a.z2)<Math.max(b.z1,b.z2)&&Math.max(a.z1,a.z2)>Math.min(b.z1,b.z2);if(overlap){a.collision=true;b.collision=true;}}
}
function transform(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y*cp-z*sp;return{x,y,z:p.y*sp+z*cp};}
function scaleFor(){const r=rack();if(!r)return 1;const usableW=Math.max(300,stage.clientWidth-100),usableH=Math.max(260,stage.clientHeight-90),extentW=RACK_W+Math.abs(Math.sin(yaw))*r.depth*.72,extentH=r.he*U_MM+Math.abs(Math.sin(pitch))*r.depth*.55;return Math.min(usableW/extentW,usableH/extentH)*zoom;}
function project(p,scale){const t=transform(p);return{x:stage.clientWidth/2+t.x*scale,y:stage.clientHeight/2-t.y*scale,z:t.z};}
function shade(hex,factor,alpha){const n=parseInt(hex.slice(1),16),r=clamp(Math.round((n>>16)*factor),0,255),g=clamp(Math.round(((n>>8)&255)*factor),0,255),b=clamp(Math.round((n&255)*factor),0,255);return`rgba(${r},${g},${b},${alpha})`;}
function addCuboid(faces,b,base,alpha=.82,kind='gear'){
  const v=[{x:b.x1,y:b.y1,z:b.z1},{x:b.x2,y:b.y1,z:b.z1},{x:b.x2,y:b.y2,z:b.z1},{x:b.x1,y:b.y2,z:b.z1},{x:b.x1,y:b.y1,z:b.z2},{x:b.x2,y:b.y1,z:b.z2},{x:b.x2,y:b.y2,z:b.z2},{x:b.x1,y:b.y2,z:b.z2}],defs=[[0,1,2,3,.84],[4,7,6,5,.58],[0,4,5,1,.48],[3,2,6,7,1.08],[1,5,6,2,.7],[0,3,7,4,.62]];
  defs.forEach(d=>{const pts=d.slice(0,4).map(i=>v[i]),depth=pts.reduce((n,p)=>n+transform(p).z,0)/4;faces.push({pts,depth,fill:shade(base,d[4],alpha),stroke:kind==='frame'?'rgba(235,239,241,.48)':'rgba(10,13,17,.8)',kind});});
}
function addFrame(faces,r){const H=r.he*U_MM,D=r.depth,t=14,c='#aeb5ba';for(const x of[-RACK_W/2,RACK_W/2-t])for(const z of[-D/2,D/2-t])addCuboid(faces,{x1:x,x2:x+t,y1:-H/2,y2:H/2,z1:z,z2:z+t},c,.94,'frame');for(const y of[-H/2,H/2-t])for(const z of[-D/2,D/2-t])addCuboid(faces,{x1:-RACK_W/2,x2:RACK_W/2,y1:y,y2:y+t,z1:z,z2:z+t},c,.94,'frame');for(const x of[-RACK_W/2,RACK_W/2-t])for(const y of[-H/2,H/2-t])addCuboid(faces,{x1:x,x2:x+t,y1:y,y2:y+t,z1:-D/2,z2:D/2},c,.9,'frame');}
function drawEdge(a,b,scale,color='rgba(224,229,232,.68)',width=1.5){const p=project(a,scale),q=project(b,scale);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function render(){
  resizeCanvas();const r=rack();ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);if(!r)return;makeBoxes();const scale=scaleFor(),faces=[];
  boxes.forEach((b,i)=>{const selected=b.uid===selectedUid,base=b.over||b.collision?'#ff5266':b.unknown?'#e2a73a':selected?'#72adff':['#357fd8','#2c8aa0','#596fd4','#277a9b'][i%4];addCuboid(faces,b,base,selected?.94:.78);});addFrame(faces,r);faces.sort((a,b)=>b.depth-a.depth).forEach(face=>{const pts=face.pts.map(p=>project(p,scale));ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fillStyle=face.fill;ctx.fill();ctx.strokeStyle=face.stroke;ctx.lineWidth=face.kind==='frame'?1.1:.8;ctx.stroke();});
  const H=r.he*U_MM,D=r.depth,corners=[[-RACK_W/2,-H/2,-D/2],[RACK_W/2,-H/2,-D/2],[RACK_W/2,H/2,-D/2],[-RACK_W/2,H/2,-D/2],[-RACK_W/2,-H/2,D/2],[RACK_W/2,-H/2,D/2],[RACK_W/2,H/2,D/2],[-RACK_W/2,H/2,D/2]].map(v=>({x:v[0],y:v[1],z:v[2]})),edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];edges.forEach(e=>drawEdge(corners[e[0]],corners[e[1]],scale));
  boxes.forEach(b=>{if(b.uid!==selectedUid&&scale*b.g.he*U_MM<18)return;const z=b.g.mount==='rear'?b.z2:b.z1,p=project({x:(b.x1+b.x2)/2,y:(b.y1+b.y2)/2,z},scale);ctx.save();ctx.font=(b.uid===selectedUid?'600 12px':'10px')+' -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.85)';const text=b.name+(b.depth?' · '+b.depth+' mm':' · depth?');ctx.strokeText(text,p.x,p.y,190);ctx.fillStyle='#f3f6fb';ctx.fillText(text,p.x,p.y,190);ctx.restore();});
}
function resizeCanvas(){const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}}
function renderSidebar(){const r=rack();if(!r){summary.innerHTML='<div class="empty">No rack found.</div>';gearList.innerHTML='';return;}makeBoxes();const known=boxes.filter(b=>b.depth),maxDepth=Math.max(0,...known.map(b=>b.depth)),collisions=boxes.filter(b=>b.collision).length,missing=boxes.filter(b=>b.unknown).length,clearance=known.length?r.depth-maxDepth:r.depth;
  summary.innerHTML='<h2>'+esc(r.name)+'</h2><p>'+r.he+'U · 19-inch rack · drag the model to inspect all sides</p><div class="cards"><div class="card"><span>Rack depth</span><b>'+r.depth+' mm</b></div><div class="card '+(clearance<0?'bad':'')+'"><span>Min. clearance</span><b>'+clearance+' mm</b></div><div class="card '+(collisions?'bad':'')+'"><span>Collisions</span><b>'+collisions+'</b></div><div class="card '+(missing?'warn':'')+'"><span>Depth missing</span><b>'+missing+'</b></div></div>';
  if(!boxes.length){gearList.innerHTML='<div class="empty">This rack has no equipment yet.</div>';return;}gearList.innerHTML='';[...boxes].sort((a,b)=>a.p.top-b.p.top).forEach(b=>{const button=document.createElement('button');button.className='gear-row'+(b.uid===selectedUid?' selected':'')+(b.over||b.collision?' bad':b.unknown?' warn':'');const badges=(b.over?'<span class="badge bad">Too deep</span>':'')+(b.collision?'<span class="badge bad">Collision</span>':'')+(b.unknown?'<span class="badge warn">Add depth</span>':'');button.innerHTML='<div class="top"><strong>'+esc(b.name)+'</strong><small>'+esc(b.label)+'</small></div><div class="depth-track"><i style="width:'+Math.min(100,Math.max(2,b.drawDepth/r.depth*100))+'%"></i></div><div class="badges"><span class="badge">'+(b.depth?b.depth+' mm':'Unknown depth')+'</span>'+badges+'</div>';button.addEventListener('click',()=>{selectedUid=selectedUid===b.uid?null:b.uid;renderSidebar();render();});gearList.appendChild(button);});
}
function populateRacks(){const select=document.getElementById('rackSelect');select.innerHTML=(state.racks||[]).map(r=>'<option value="'+esc(r.id)+'">'+esc(r.name)+'</option>').join('');select.value=rackId;}
function refresh(){if(!loadState()){summary.innerHTML='<div class="empty">No Rack Builder project found in this browser.</div>';gearList.innerHTML='';return;}populateRacks();renderSidebar();render();}
function preset(nextYaw,nextPitch){yaw=nextYaw;pitch=nextPitch;zoom=1;render();}
document.getElementById('rackSelect').addEventListener('change',e=>{rackId=e.target.value;selectedUid=null;renderSidebar();render();});document.getElementById('front').addEventListener('click',()=>preset(0,0));document.getElementById('rear').addEventListener('click',()=>preset(Math.PI,0));document.getElementById('iso').addEventListener('click',()=>preset(-.62,-.28));document.getElementById('zoomOut').addEventListener('click',()=>{zoom=clamp(zoom-.1,.45,2.2);render();});document.getElementById('zoomIn').addEventListener('click',()=>{zoom=clamp(zoom+.1,.45,2.2);render();});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)*.009;pitch=clamp(drag.pitch-(e.clientY-drag.y)*.007,-1.15,1.15);render();});canvas.addEventListener('pointerup',e=>{drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);canvas.classList.remove('dragging');});canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging');});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom+(e.deltaY<0 ? .08 : -.08),.45,2.2);render();},{passive:false});canvas.addEventListener('dblclick',()=>preset(-.62,-.28));
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')yaw-=.08;if(e.key==='ArrowRight')yaw+=.08;if(e.key==='ArrowUp')pitch=clamp(pitch+.06,-1.15,1.15);if(e.key==='ArrowDown')pitch=clamp(pitch-.06,-1.15,1.15);if(e.key.startsWith('Arrow'))render();});window.addEventListener('storage',e=>{if(e.key===LS_KEY)refresh();});new ResizeObserver(()=>render()).observe(stage);refresh();
</script>
</body>
</html>
